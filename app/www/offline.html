<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__APP_NAME__</title>
<style>
  :root{--paper:#F2F5F9;--ink:#14233B;--slate:#5A6A80;--jade:#0C8A78}
  @media (prefers-color-scheme:dark){:root{--paper:#0E1625;--ink:#E7EDF6;--slate:#93A3B8;--jade:#2BC2A8}}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;box-sizing:border-box}
  h1{font-size:20px;margin:18px 0 6px}
  p{color:var(--slate);font-size:15px;line-height:1.6;margin:0 0 24px;max-width:300px}
  button{border:0;border-radius:12px;background:var(--jade);color:#fff;font-size:16px;padding:12px 28px;font-weight:600}
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="26" stroke="currentColor" stroke-opacity=".2" stroke-width="2"/><path d="M18 30l7-7 6 6 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 40h28" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/></svg>
  <h1>连接不上服务器</h1>
  <p>请检查网络后重试。如果一直打不开，可能是线路被拦截，可以开启网络加速后再试。</p>
  <button onclick="location.href='__SITE_URL__'">重新连接</button>
</main>
</body>
</html>
